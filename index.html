/* Layout: a crude 2001-era desktop. Low-res dithered ground (or the owner's image), every photo is its own bevelled window, free to drag, stretch and pile up; a grey bar at the bottom. System fonts only, small sizes, no smoothing. Single light look by choice. */

    db.collection("settings").doc("desk").onSnapshot((s) => { const v = s.exists ? s.data() : null; setWallpaper(v && (v.bgUrl || (v.bgAssetId && "/_blob/" + v.bgAssetId))); }, () => {});
    let firstSnap = true;
    db.collection("photos").orderBy("createdAt", "asc").onSnapshot((snap) => {
      ready = true;
      photos = snap.docs.map((s) => Object.assign({ id: s.id }, s.data()));
      const live = new Set(photos.map((p) => p.id));
      for (const [id, w] of wins) if (!(w.photo && (w.photo.isEdit || w.photo.isShared)) && !live.has(w.photo ? w.photo.id : id)) { picked.delete(w); w.el.remove(); w.task.remove(); wins.delete(id); }
      updateGroup();
      const typing = document.activeElement && document.activeElement.id && document.activeElement.id.startsWith("t-");
      photos.forEach((p, i) => { if (!(typing && document.activeElement.id === "t-" + p.id)) syncPhotoWin(p, i); });
      for (const [key, w] of wins) if (w.clone) { const p = photos.find((q) => q.id === w.photo.id); if (p) syncPhotoWin(p, 0, key); }
      updateCounter();
      if (!photos.length) openIndex(); else renderIndex();
      if (firstSnap && readme) focusWin(readme);
      firstSnap = false;
    }, () => { loadMsg = "Couldn't load the gallery."; openIndex(); });
  })();
})();
</script>
