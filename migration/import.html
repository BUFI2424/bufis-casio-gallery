<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Import old gallery</title>
<style>
  body { margin: 0; background: #000080; font: 13px Verdana, sans-serif; color: #000; display: grid; place-items: center; min-height: 100vh; }
  .box { background: #c0c0c0; padding: 18px 20px; width: min(420px, calc(100vw - 32px)); box-sizing: border-box;
    box-shadow: inset 1px 1px 0 #fff, inset -1px -1px 0 #000, inset 2px 2px 0 #dfdfdf, inset -2px -2px 0 #808080; }
  h1 { font-size: 15px; margin: 0 0 10px; }
  pre { background: #fff; padding: 8px; max-height: 220px; overflow: auto; font: 11px monospace; white-space: pre-wrap; }
</style>
<script>window.__backendReady = new Promise((r) => (window.__backendResolve = r));</script>
<script type="module" src="../js/backend.js?v=2"></script>
</head>
<body>
<div class="box">
  <h1>Import the old gallery</h1>
  <p id="who">Checking who you are…</p>
  <button id="go" disabled>Import photos, texts and manual</button>
  <pre id="log" hidden></pre>
</div>
<script type="module">
  const $ = (id) => document.getElementById(id);
  const b = await window.__backendReady;
  if (!(await b.isOwner())) { $("who").innerHTML = 'Only the owner can import. <a href="../#login">Sign in first</a>, then come back here.'; }
  else {
    $("who").textContent = "Signed in as the owner. This copies the old gallery into Firebase (existing records with the same name are replaced).";
    $("go").disabled = false;
  }
  $("go").onclick = async () => {
    $("go").disabled = true; const log = $("log"); log.hidden = false;
    const say = (t) => { log.textContent += t + "\n"; log.scrollTop = 1e9; };
    try {
      const db = await b.use("db");
      const data = await (await fetch("export.json")).json();
      for (const [id, d] of Object.entries(data.photos)) { await db.doc("photos/" + id).set(d); say("photo " + d.fileName); }
      for (const [id, d] of Object.entries(data.settings)) { await db.doc("settings/" + id).set(d); say("settings/" + id); }
      say("\nDone. Open the gallery: ../");
    } catch (e) { say("Stopped: " + (e.code || e.message)); $("go").disabled = false; }
  };
</script>
</body>
</html>
